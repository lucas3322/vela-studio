appId: com.pardinho.vela
productName: Vela Studio
copyright: Copyright © 2026 Lucas Pardinho

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.prettierrc,tsconfig*.json}'

# Drivers nativos ficam fora do asar: better-sqlite3 carrega um .node
# que precisa existir como arquivo real no disco.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# ── macOS ────────────────────────────────────────────────────────────
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  # Universal cobre Apple Silicon e os Intel que ainda estão por aí.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Lucas Pardinho

dmg:
  # O título vira o nome do volume montado em /Volumes. Incluir a arquitetura
  # impede que os builds arm64 e x64 disputem o mesmo ponto de montagem —
  # era essa colisão que fazia o `hdiutil detach` falhar.
  title: ${productName} ${arch}
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# ── Windows ──────────────────────────────────────────────────────────
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Instalador por usuário: não pede elevação de administrador.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vela Studio
  artifactName: ${productName}-${version}-setup.${ext}
  uninstallDisplayName: ${productName}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# ── Linux (bônus: sai de graça do mesmo build) ───────────────────────
linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
    - deb

afterPack: scripts/after-pack.mjs

npmRebuild: true
