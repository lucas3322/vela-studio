appId: com.pardinho.vela
productName: Vela Studio
copyright: Copyright © 2026 Lucas Pardinho

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.prettierrc,tsconfig*.json}'

# Drivers nativos ficam fora do asar: better-sqlite3 carrega um .node
# que precisa existir como arquivo real no disco.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

mac:
  category: public.app-category.developer-tools
  # Universal cobre Apple Silicon e os Intel que ainda estão por aí.
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Lucas Pardinho

dmg:
  title: ${productName}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

npmRebuild: true
