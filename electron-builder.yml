# O appId vira o bundle identifier, e o macOS usa ele para nomear as pastas
# que cria por conta própria para cada app: $TMPDIR/<appId>/ e
# ~/Library/Caches/<appId>/. Ou seja, esta string aparece como nome de pasta na
# máquina de todo usuário — não é lugar para nome de pessoa.
#
# Trocar é seguro para quem já usa: as conexões salvas ficam em
# app.getPath('userData') e as senhas no item de Chaves, ambos derivados do
# productName ("Vela Studio"), não do appId. Ninguém perde dado na troca.
appId: com.velastudio.app
productName: Vela Studio
copyright: Copyright © 2026 Vela Studio

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.prettierrc,tsconfig*.json}'

# Drivers nativos ficam fora do asar: better-sqlite3 carrega um .node
# que precisa existir como arquivo real no disco.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# ── macOS ────────────────────────────────────────────────────────────
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  # Universal cobre Apple Silicon e os Intel que ainda estão por aí.
  # `artifactName` explícito: por padrão o electron-builder omite "x64" do
  # nome, e sobra um "Vela Studio-mac.zip" que ninguém sabe se é Intel ou
  # Apple Silicon.
  artifactName: ${productName}-${version}-${arch}.${ext}
  #
  # A ARQUITETURA VEM DA LINHA DE COMANDO, DE PROPÓSITO.
  #
  # Listar `arch: [arm64, x64]` aqui faz o electron-builder empacotar as duas
  # numa execução só — e isso corrompe o build. Ele copia o módulo nativo para
  # dentro do .app com *hard link*; ao recompilar o better-sqlite3 para a
  # segunda arquitetura, o mesmo inode é sobrescrito e o conteúdo muda dentro
  # do bundle da primeira, que já estava empacotado e assinado.
  #
  # O estrago é duplo e silencioso: o DMG arm64 sai com um binário x86_64
  # dentro, e o selo da assinatura quebra — o macOS passa a dizer que o app
  # "está danificado e não pode ser aberto".
  #
  # Uma execução do electron-builder por arquitetura elimina a sobreposição.
  target:
    - dmg
    # O zip existe só para atualização automática (electron-updater).
    # Para instalar na mão, o arquivo é o .dmg.
    - zip
  # ── Quando houver Apple Developer ID (US$ 99/ano) ──────────────────
  #
  # Enquanto não houver, o app sai com assinatura ad-hoc e o Gatekeeper barra a
  # primeira abertura com "a Apple não pôde verificar se o item está livre de
  # malware". Isso NÃO é defeito do pacote — é o comportamento padrão para
  # qualquer app não notarizado. Não confundir com "o app está danificado",
  # que era binário de arquitetura errada dentro do bundle.
  #
  # Para eliminar o aviso, com o certificado em mãos:
  #   1. hardenedRuntime: true          (a notarização exige)
  #   2. notarize: { teamId: "XXXXXXXXXX" }
  #   3. exportar APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD e APPLE_TEAM_ID
  #
  # Ligar `hardenedRuntime` ANTES de ter o certificado só restringe o app sem
  # nenhum ganho de confiança — por isso fica desligado aqui.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Vela Studio

dmg:
  # O título vira o nome do volume montado em /Volumes. Incluir a arquitetura
  # impede que os builds arm64 e x64 disputem o mesmo ponto de montagem —
  # era essa colisão que fazia o `hdiutil detach` falhar.
  title: ${productName} ${arch}
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# ── Windows ──────────────────────────────────────────────────────────
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Instalador por usuário: não pede elevação de administrador.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vela Studio
  artifactName: ${productName}-${version}-setup.${ext}
  uninstallDisplayName: ${productName}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# ── Linux (bônus: sai de graça do mesmo build) ───────────────────────
linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
    - deb

afterPack: scripts/after-pack.mjs

npmRebuild: true
