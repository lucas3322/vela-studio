# Gera os instaladores em cada sistema nativamente.
#
# Por que existe: módulos nativos (better-sqlite3) compilam para o sistema
# onde o build roda. Empacotar Windows a partir do macOS funciona só porque
# baixamos um binário pré-compilado no hook `afterPack` — aqui a compilação é
# nativa e não depende de existir prebuild publicado.

name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: mac
          # `windows-2022`, não `windows-latest`, e isso é deliberado.
          #
          # O GitHub migrou o `windows-latest` para a imagem do Server 2025
          # (o log do build falho reporta `Windows_NT 10.0.26100`; a 2022
          # reporta `10.0.20348`). Nela, o node-gyp 9.4.1 — que vem junto do
          # @electron/rebuild — não acha o Visual Studio: ele detecta compilando
          # um arquivo C# via `Add-Type` no PowerShell, e esse caminho falha
          # ali. O stack cai nos fallbacks de VS 2013/2015 e desiste.
          #
          # O better-sqlite3 precisa de toolchain C++ de qualquer forma, porque
          # o `electron-builder install-app-deps` recompila para o ABI do
          # Electron, não para o do Node.
          #
          # Isto é uma trégua, não a cura: a imagem 2022 tem data para sair. A
          # correção durável é subir o node-gyp (o 11 tem mais estratégias de
          # detecção), e isso só dá para validar rodando no Windows.
          - os: windows-2022
            script: win
          - os: ubuntu-latest
            script: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O node-gyp 9.x (que o @electron/rebuild traz) ainda faz
      # `from distutils.version import StrictVersion`, e o distutils foi
      # removido no Python 3.12 pela PEP 632. Sem fixar a versão, o runner usa
      # o Python que a imagem trouxer — e o dia em que o GitHub atualizou essa
      # imagem, a compilação do better-sqlite3 quebrou sem nenhuma mudança
      # nossa. Fixar aqui tira o build da mão do calendário de terceiros.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Ferramentas que o electron-builder baixa em tempo de build: os binários
      # do Electron, o fpm (para .deb), o appimage-12 (para AppImage), o
      # mksquashfs. Sem cache, toda execução depende de o download dar certo —
      # e foi exatamente um desses que derrubou o build do Linux, com o
      # artefato existindo e respondendo normalmente fora do runner.
      #
      # Com o cache, a rede só é necessária na primeira execução de cada
      # versão do electron-builder.
      - name: Cache das ferramentas de empacotamento
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ferramentas-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ferramentas-${{ runner.os }}-

      - run: npm ci

      - name: Verificar tipos e testes
        run: |
          npm run typecheck
          npm test

      # Uma segunda tentativa. O download dessas ferramentas falha de vez em
      # quando por limite de requisição do GitHub, e repetir custa menos que
      # segurar um release inteiro por causa disso.
      - name: Empacotar
        run: npm run ${{ matrix.script }} || npm run ${{ matrix.script }}
        shell: bash
        env:
          # Sem certificado configurado o electron-builder pula a assinatura
          # em vez de falhar. Adicione os secrets quando tiver as contas.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: vela-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  # Só quando o push é de uma tag `v*` — ou seja, quando `npm run release` rodou.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true

      - name: Extrair a seção desta versão do CHANGELOG
        id: notas
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pega da linha "## <versão>" até o próximo "## ", sem incluí-lo.
          awk -v v="## $VERSION" '
            $0 ~ "^"v" " || $0 == v {captura=1; next}
            captura && /^## / {exit}
            captura {print}
          ' CHANGELOG.md > notas.md
          # Sem changelog não travamos a release: publicamos sem corpo.
          [ -s notas.md ] || echo "Consulte o CHANGELOG.md." > notas.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notas.md
          draft: false
          files: |
            artefatos/*.dmg
            artefatos/*.exe
            artefatos/*.AppImage
            artefatos/*.deb
