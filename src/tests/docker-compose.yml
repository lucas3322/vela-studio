# Bancos descartáveis para os testes de ponta a ponta dos drivers.
# Portas propositalmente fora do padrão, para não colidir com bancos locais.
#
#   docker compose -f src/tests/docker-compose.yml up -d --wait
#   npm run test:db
#   docker compose -f src/tests/docker-compose.yml down

services:
  mysql:
    image: mysql:8.0
    container_name: vela-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: vela123
      MYSQL_DATABASE: lojinha
    ports:
      - '33061:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-uroot', '-pvela123']
      interval: 3s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    container_name: vela-pg-test
    environment:
      POSTGRES_PASSWORD: vela123
      POSTGRES_DB: lojinha
    ports:
      - '54321:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: vela-mongo-test
    ports:
      - '27018:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: vela-redis-test
    ports:
      - '63791:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 5s
      retries: 20

  # Servidor SSH para os testes de túnel. Da rede interna do compose ele
  # enxerga os bancos pelo nome do serviço (mysql:3306, postgres:5432, ...) —
  # do mesmo jeito que um bastion enxerga o banco de produção, que de fora
  # não está acessível. Senha e chave são de teste, só existem aqui.
  ssh:
    image: alpine:3.20
    container_name: vela-ssh-test
    command:
      - sh
      - -c
      - >-
        apk add --no-cache openssh >/dev/null &&
        ssh-keygen -A &&
        echo 'root:vela123' | chpasswd &&
        sed -i
        -e 's/^#\?PermitRootLogin.*/PermitRootLogin yes/'
        -e 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/'
        -e 's/^#\?AllowTcpForwarding.*/AllowTcpForwarding yes/'
        /etc/ssh/sshd_config &&
        mkdir -p /root/.ssh && chmod 700 /root/.ssh &&
        exec /usr/sbin/sshd -D -e
    ports:
      - '22221:22'
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z 127.0.0.1 22']
      interval: 3s
      timeout: 5s
      retries: 30
